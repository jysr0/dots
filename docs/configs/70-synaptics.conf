# /etc/X11/xorg.conf.d
# install: xf86-input-synaptics

############
# TOUCHPAD #
############

Section "InputClass"
    Identifier "touchpad"
    Driver "synaptics" # based on `Driver` put configs in `libinput`, `synaptics` or alone.
    MatchIsTouchpad "on"
        Option "TapButton1" "1"
        Option "TapButton2" "3"
        Option "TapButton3" "2"
        Option "VertEdgeScroll" "off"
        Option "VertTwoFingerScroll" "on"
        Option "HorizEdgeScroll" "off"
        Option "HorizTwoFingerScroll" "on"
        Option "CircularScrolling" "off"
        Option "CircScrollTrigger" "2"
        #Option "EmulateTwoFingerMinZ" "40"
        #Option "EmulateTwoFingerMinW" "8"
        Option "CoastingSpeed" "0"
        Option "FingerLow" "30" #30
        Option "FingerHigh" "50" #50
        Option "MaxTapTime" "125" #125
	Option "ClickPad" "off"
EndSection

