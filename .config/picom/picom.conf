# ~/.config/picom/picom.conf

#daemon = false;

shadow = false;
#shadow-ignore-shaped = true;
shadow-radius = 8;
shadow-opacity = 0.5; #0.0-1.0
shadow-offset-x = -7; #px
shadow-offset-y = -7; #px
#shadow-color = "#000000"; #hex
#shadow-red = ; #0.0-1.0
#shadow-green = ; #0.0-1.0
#shadow-blue = ; #0.0-1.0
#shadow-exclude = ;
#clip-shadow-above = ;
#crop-shadow-to-monitor = false;

fading = true;
#no-fading-openclose = false;
#no-fading-destroyed-argb = false;
fade-in-step = 0.027; #the lower, the slower.
fade-out-step = 0.054; #the lower, the slower.
fade-delta = 5;
#fade-exclude = ;

#focus-exclude = ;
#window-shader-fg = "default"; #requires disabling of legacy-backends
#window-shader-fg-rule = ; #requires disabling of legacy-backends

opacity = 1.0;
#active-opacity = 1.0; #0.0-1.0
#inactive-opacity = 1.0; #0.0-1.0
#inactive-opacity-override = false;
dim = 0.0; #0.0-1.0
#inactive-dim = 0.0; #0.0-1.0
#inactive-dim-fixed = false;
frame-opacity = 1.0; #0.0-1.0
detect-client-opacity = true;
#opacity-rule = ;

#transparent-clipping = false; #-----
#transparent-clipping-exclude = ;

#blur-background = ; #bool
#blur-background-frame = ; #bool
#blur-background-fixed = false;
blur-kern = "3x3box";
#blur-background-exclude = ;

detect-transient = true;
#detect-client-leader = false;

corner-radius = 0; # >= 0
#corner-radius-rules = ;
#rounded-corners-exclude = ;
detect-rounded-corners = true;

#no-frame-pacing = true;
#mark-wmwin-focused = false;
#mark-ovredir-focused = false;
#use-ewmh-active-win = false;
#no-ewmh-fullscreen = false;
#resize-damage = ; #int
use-damage = true;
#no-use-damage = false;
#max-brightness = 1.0; #requires use-damage
#invert-color-include = ;
backend = "xrender";
#xrender-sync-fence = false;
#force-win-blend = false;
dithered-present = false;

#benchmark = ;
#benchmark-wid = ;

#unredir-if-possible = false;
#unredir-if-possible-delay = 0; #milli sec
#unredir-if-possible-exclude = ;

vsync = true;
#no-vsync = false;

#write-pid-path = "";
#plugins = "";
#log-level = "warn";
#log-file = "";

#dbus = true;

#blur={
#	method="gaussian";
#	size=10;
#	deviation=5.0; #float
#	strength= ; #0-20
#};

# See WINDOW RULES section in the man page.
rules = (
	# see: WINDOW RULES and FORMAT OF CONDITIONS in 'man picom'.

	# format:
	# rules ( { KEY=VALUE; KEY=VALUE; ... }, { KEY=VALUE; KEY=VALUE; ... }, { KEY=VALUE; KEY=VALUE; ... }, ... )
	# each {} is a 'sub-item' contains a 'condition' to be matched and 'options' to be applied when 'conidtion' is met, and format is as follows:
	#
	# 'condition' devided into 'terms' and terms deviced into 'items': condition <- term <- item.

	# window types: "toolbar", "utility",
	# 				"menu", "dropdown_menu", "popup_menu",
	# 				"splash", "dialog", "tooltip", "notification",
	# 				"normal", "desktop", "dock",
	#				"combo", "dnd", "unknown"
	
	{
		match = "window_type = 'toolbar' || window_type = 'utility'";
		shadow = false;     
		full-shadow = false;
		fade = false;       
		opacity = 1.0; #0.0-1.0
		#dim = 0.0;     #0.0-1.0
		#corner-radius = 0; #pix
		blur-background = false;  
		invert-color = false;     
		clip-shadow-above = false;
		#unredir = ;              
		transparent-clipping = false;
		#shader = ;     #see SHADER INTERFACE in man page.
		#animations = ; #see ANIMATIONS in man page.
		#focus = false;  
		#redir-ignore = ;
	},
	{
		match = "window_type = 'menu'          ||"
			"window_type = 'dropdown_menu' ||"
			"window_type = 'popup_menu'    ||"
			"window_type = 'notification'  ||"
			"window_type = 'tooltip'       ||"
			"window_type = 'dialog'        ||"
			"window_type = 'splash'";
		shadow = false;
		#full-shadow = false;
		fade = true;
		opacity = 1.0; #0.0-1.0
		#dim = 0.0;     #0.0-1.0
		#corner-radius = 10; #pix
		blur-background = false;  
		invert-color = false;     
		clip-shadow-above = false;
		#unredir = ;
		transparent-clipping = false;
		#shader = ;     #see SHADER INTERFACE in man page.
		#animations = ; #see ANIMATIONS in man page.
		#focus = false;  
		#redir-ignore = ;
	},
	{
  		match = "!focused && (class_i ?= 'alacritty' || class_i ?= 'st' || class_g ?= 'alacritty' || class_g ?= 'st')";
		shadow = false;   
		full-shadow = false;   
		fade = false;          
		opacity = 0.93; #0.0-1.0
		dim = 0.0; #0.0-1.0
		#corner-radius = 0; #pix
		blur-background = false;  
		invert-color = false;     
		clip-shadow-above = false;
		#unredir = ;
		transparent-clipping = false; 
		#shader = ;     #see SHADER INTERFACE in man page.
		#animations = ; #see ANIMATIONS in man page.
		#focus = false;  
		#redir-ignore = ;
	}
)

# `@include` directive can be used to include additional configuration files.
# Relative paths are search either in the parent of this configuration file
# (when the configuration is loaded through a symlink, the symlink will be
# resolved first). Or in `$XDG_CONFIG_HOME/picom/include`.
#
# @include "extra.conf"
