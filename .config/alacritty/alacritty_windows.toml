[general]
live_config_reload = true
working_directory = "C:/Users/YsrYser" #windows

[window]
dimensions      = { columns = 88, lines = 27 }
dynamic_padding = false
opacity         = 0.94
blur            = false
#startup_mode   = "Windowed"
title           = "Alacritty"
dynamic_title   = false
class = { instance = "alacritty", general = "alacritty" }
#decorations_theme_variant = "None" # Dark|Light|None
level = "Normal"

[scrolling]
history    = 10000
multiplier = 1

[font]
offset = { x = 0, y = 0 } #the extra space around each character. y can be thought of as modifying the line spacing, and x as modifying the letter spacing.
#determines the locations of the glyphs within their cells with the default being at the bottom. Increasing x moves the glyph to the right, increasing y moves the glyph upward.
glyph_offset = { x = 0, y = 0 } 
builtin_box_drawing = false
size = 10
normal      = { family = "CaskaydiaMono Nerd Font Mono", style = "Regular" }
italic      = { family = "CaskaydiaMono Nerd Font Mono", style = "Italic" }
bold        = { family = "CaskaydiaMono Nerd Font Mono", style = "Bold" }
bold_italic = { family = "CaskaydiaMono Nerd Font Mono", style = "Bold Italic" }

[colors]	
cursor    = { text = "CellBackground", cursor = "CellForeground" }
selection = { text = "CellBackground", background = "CellForeground" }
draw_bold_text_with_bright_colors = true

[colors.primary]
foreground = "#eeeeee"
background = "#000000"
#dim_foreground    = "#828482"
#bright_foreground = "None"

[selection]
save_to_clipboard = false

[cursor]
style = { shape = "Block", blinking = "Off" } #shape: Block|Underline|Beam; #blinking: Never|Off|On|Always
blink_timeout    = 60
unfocused_hollow = true #when true cursor will be rendered as a hollow box when the window is not focused

[mouse]
hide_when_typing = true
bindings = [
	{ mouse = "Right", mods = "Control", action = "Paste" },
	{ mouse = "Right", action = "Copy" },
]

[keyboard]
bindings = [
	{ key = "c", mods = "Control | Shift", action = "Copy" },
	{ key = "v", mods = "Control | Shift", action = "Paste" },
	{ key = "+", mods = "Control", action = "IncreaseFontSize" },
	{ key = "-", mods = "Control", action = "DecreaseFontSize" },
	{ key = "0", mods = "Control", action = "ResetFontSize" },
	{ key = "Numpad0", mods = "Control", action = "ResetFontSize" },
	{ key = "PageDown", action = "ScrollPageDown" },
	{ key = "PageUp", action = "ScrollPageUp" },
	{ key = "PageDown", mods = "Control | Shift", action = "ScrollLineDown" },
	{ key = "PageUp", mods = "Control | Shift", action = "ScrollLineUp" },
	#{ key = "t", mods = "Control | Shift", action = "SpawnNewInstance" },
	{ key = "Return", mods = "Super | Shift", command = "alacritty" },
	#{ key = "c", mods = "Super | Shift", action = "Quit" },
]

[bell]
animation = "Ease"
duration  = 0
color = "#777777"
#command = { program = "echo", args = ["WRONG",] }
